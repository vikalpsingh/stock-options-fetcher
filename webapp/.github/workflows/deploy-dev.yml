name: Deploy DEV

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy develop to DEV Ubuntu-2
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEV_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on DEV server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" \
            "/var/www/tradingapp/webapp/scripts/deploy.sh develop"
