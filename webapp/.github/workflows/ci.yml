name: CI

on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  python-ci:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Python compile validation
        run: |
          set -euo pipefail
          python -m compileall -q \
            -x '(^|/)(\.git|\.venv|venv|node_modules|__pycache__|\.pytest_cache|\.next|dist|build|coverage)(/|$)' \
            .

      - name: Run pytest when tests exist
        run: |
          set -euo pipefail
          if [ -d tests ] && find tests -type f -name 'test*.py' | grep -q .; then
            python -m pytest tests
          else
            echo "No Python tests found under tests/."
          fi
